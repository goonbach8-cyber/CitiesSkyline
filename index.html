<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cities Prototype v0.2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>Cities Prototype</h1>
        <p>v0.2 – City Builder Test</p>
      </div>
      <div class="stats">
        <span>Geld <strong id="money">100'000</strong></span>
        <span>Einwohner <strong id="population">0</strong></span>
        <span>Jobs <strong id="jobs">0</strong></span>
        <span>Tag <strong id="day">1</strong></span>
      </div>
    </header>

    <main>
      <aside class="toolbar">
        <div class="label">BAUEN</div>
        <button data-tool="road" class="active">Straße <small>120/Feld</small></button>
        <button data-tool="residential">Wohnzone <small>40/Feld</small></button>
        <button data-tool="commercial">Gewerbezone <small>55/Feld</small></button>
        <button data-tool="industrial">Industriezone <small>55/Feld</small></button>
        <button data-tool="bulldoze">Abreißen <small>50/Feld</small></button>

        <div class="label top-gap">NACHFRAGE</div>
        <div class="demand-row"><span>W</span><div class="bar"><i id="demandR"></i></div></div>
        <div class="demand-row"><span>G</span><div class="bar"><i id="demandC"></i></div></div>
        <div class="demand-row"><span>I</span><div class="bar"><i id="demandI"></i></div></div>

        <div class="label top-gap">ZEIT</div>
        <button id="pauseBtn">Pause</button>
        <button id="speedBtn">1x</button>
        <button id="saveBtn">Speichern</button>
        <button id="loadBtn">Laden</button>
        <button id="resetBtn" class="danger">Neue Stadt</button>
      </aside>

      <section class="game-wrap">
        <canvas id="game"></canvas>
        <div id="toast"></div>
        <div class="hint">Ziehen = bauen/zonen · Mausrad = Zoom · Mittlere Maustaste oder Leertaste+Ziehen = Kamera · WASD = Kamera</div>
      </section>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
