<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cities Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>Cities Prototype</h1>
        <p>Browser-Testversion</p>
      </div>
      <div class="stats">
        <span>Geld: <strong id="money">100000</strong></span>
        <span>Einwohner: <strong id="population">0</strong></span>
        <span>Tag: <strong id="day">1</strong></span>
      </div>
    </header>

    <main>
      <aside class="toolbar">
        <button data-tool="road" class="active">Straße</button>
        <button data-tool="residential">Wohnen</button>
        <button data-tool="commercial">Gewerbe</button>
        <button data-tool="industrial">Industrie</button>
        <button data-tool="bulldoze">Abreißen</button>
        <hr />
        <button id="pauseBtn">Pause</button>
        <button id="speedBtn">1x</button>
        <button id="resetBtn">Reset</button>
      </aside>

      <section class="game-wrap">
        <canvas id="game" width="1200" height="760"></canvas>
        <div class="hint">Linksklick bauen · Rechtsklick/ESC Auswahl abbrechen</div>
      </section>
    </main>
  </div>

  <script src="game.js"></script>
</body>
</html>
