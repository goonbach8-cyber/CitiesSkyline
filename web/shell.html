<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Lab v0.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#97b7cd}
canvas{display:block;width:100vw;height:100vh;outline:none}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:14px Arial,sans-serif;color:#eee;background:#151b1d;padding:12px 16px;border-radius:8px}
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">City Lab v0.4 wird geladen…</div>
<script>
var Module={
  canvas:(()=>document.getElementById('canvas'))(),
  setStatus:(text)=>{
    const el=document.getElementById('status');
    if(!el)return;
    if(text){el.textContent=text;}else{el.remove();}
  }
};
window.addEventListener('load',()=>document.getElementById('canvas').focus());
</script>
{{{ SCRIPT }}}
</body>
</html>
