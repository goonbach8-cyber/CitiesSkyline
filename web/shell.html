<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Lab v0.16</title>
<style>
:root{
  --hud:#18242b;
  --hud2:#202f37;
  --hud3:#273943;
  --edge:#455963;
  --edge-soft:#33464f;
  --text:#edf3f4;
  --muted:#91a3aa;
  --cyan:#68bdd1;
  --green:#5ecb79;
  --blue:#5a9fe2;
  --yellow:#dcb64d;
  --red:#d96b5c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bbbd0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;outline:none;image-rendering:auto}
button{font:inherit}
#status{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);padding:11px 15px;background:#172229;border:1px solid #50646d;color:#eaf0f2;font-size:13px;box-shadow:0 5px 20px #0005}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}

/* Fixed game bars, deliberately not floating glass cards. */
#top{position:absolute;left:0;right:0;top:0;height:38px;background:linear-gradient(#21313a,#19252c);border-bottom:1px solid #52646b;box-shadow:0 2px 7px #0005;display:flex;align-items:center;padding:0 14px;gap:18px}
.brand{font-weight:800;font-size:17px;letter-spacing:.04em;color:#f4f6f7}.ver{font-size:10px;color:#77c7d9;margin-left:-14px}
.topStat{display:flex;gap:6px;align-items:baseline;white-space:nowrap}.topStat b{font-size:12px}.topStat span{font-size:10px;color:var(--muted)}
.topSpacer{flex:1}.date{font-size:11px;color:#bac8cc}

#objective{position:absolute;left:12px;top:48px;width:230px;background:rgba(24,36,43,.94);border-left:3px solid var(--cyan);border-top:1px solid #42545d;border-right:1px solid #2f424b;border-bottom:1px solid #2f424b;padding:8px 10px;box-shadow:0 4px 12px #0003}
.objHead{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px}.objHead span{color:var(--muted)}
.progress{height:5px;background:#10181d;border:1px solid #2b3c44}.progress i{display:block;height:100%;background:var(--cyan);width:0%;transition:width .2s}

#bottom{position:absolute;left:0;right:0;bottom:0;height:112px;background:linear-gradient(#1d2b33,#152128);border-top:1px solid #566870;box-shadow:0 -3px 10px #0006}
#infoRow{height:38px;display:grid;grid-template-columns:minmax(420px,1.2fr) minmax(260px,.8fr) minmax(340px,1fr);align-items:center;border-bottom:1px solid #344851;padding:0 14px}
#stats{display:flex;gap:20px;align-items:center}.stat{white-space:nowrap}.stat b{font-size:12px}.stat small{font-size:9px;color:var(--muted);margin-left:5px}
#rci{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;align-items:center;gap:7px;font-size:9px;color:#aab8bc}.rbar{height:5px;background:#0f181c;border:1px solid #2d3d44}.rbar i{display:block;height:100%}
#rightInfo{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:9px;color:#9fb0b6}.svc b{font-size:10px;color:#e8eff1}
#speed{display:flex;pointer-events:auto;border-left:1px solid #43545c;padding-left:9px}.speed{width:31px;height:25px;border:1px solid #40525b;background:#1b2930;color:#a9b8bd;cursor:pointer}.speed+ .speed{border-left:0}.speed:hover{background:#283942}.speed.active{background:#31515d;color:white;border-color:#6fa9b8}

#tools{height:74px;display:flex;align-items:stretch;justify-content:center;pointer-events:auto;padding:7px 12px 8px;gap:2px}
.tool{width:min(120px,12.3vw);min-width:82px;position:relative;border:1px solid #30434c;border-top-color:#40545e;background:linear-gradient(#263740,#1e2d34);color:#dbe4e7;cursor:pointer;padding:5px 7px 4px;text-align:center}
.tool:hover{background:linear-gradient(#30454f,#253840)}
.tool.active{background:linear-gradient(#34505c,#293e48);border-color:#6caec0;box-shadow:inset 0 -3px 0 var(--cyan)}
.tool svg{width:25px;height:25px;display:block;margin:0 auto 2px;stroke:#c6d3d7;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.active svg{stroke:#f3fbfd}.tool .label{font-size:9px;font-weight:600;line-height:12px}.tool .cost{font-size:8px;color:#8fa2a9;line-height:10px}.hotkey{position:absolute;right:4px;top:3px;font-size:8px;color:#778a92}
.tool.zone-r.active{box-shadow:inset 0 -3px 0 var(--green)}.tool.zone-c.active{box-shadow:inset 0 -3px 0 var(--blue)}.tool.zone-i.active{box-shadow:inset 0 -3px 0 var(--yellow)}.tool.demo.active{box-shadow:inset 0 -3px 0 var(--red)}

@media(max-width:980px){
  #infoRow{grid-template-columns:1fr 1fr}#rightInfo{display:none}
  .tool{min-width:70px}.tool .cost{display:none}
}
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">City Lab v0.16 wird geladen…</div>

<div id="hud">
  <div id="top">
    <div class="brand">CITY LAB</div><div class="ver">v0.16</div>
    <div class="topStat"><b id="level">STUFE 1</b><span>Stadt</span></div>
    <div class="topStat"><b id="score">50</b><span>Score</span></div>
    <div class="topStat"><b id="traffic">0</b><span>Verkehr</span></div>
    <div class="topSpacer"></div><div class="date" id="date">1.1.2026</div>
  </div>

  <div id="objective">
    <div class="objHead"><b id="objectiveTitle">NÄCHSTE STADTSTUFE</b><span id="objectiveText">0 / 100</span></div>
    <div class="progress"><i id="objectiveFill"></i></div>
  </div>

  <div id="bottom">
    <div id="infoRow">
      <div id="stats">
        <div class="stat"><b id="money">CHF 60'000</b><small>Budget</small></div>
        <div class="stat"><b id="population">0</b><small>Einwohner</small></div>
        <div class="stat"><b id="jobs">0 / 0</b><small>Jobs</small></div>
        <div class="stat"><b id="net">-110</b><small>/ Monat</small></div>
      </div>
      <div id="rci">
        <b>W</b><div class="rbar"><i id="rd" style="width:72%;background:var(--green)"></i></div>
        <b>G</b><div class="rbar"><i id="cd" style="width:36%;background:var(--blue)"></i></div>
        <b>I</b><div class="rbar"><i id="id" style="width:46%;background:var(--yellow)"></i></div>
      </div>
      <div id="rightInfo">
        <span class="svc">STROM <b id="power">0 / 0</b></span>
        <span class="svc">WASSER <b id="water">0 / 0</b></span>
        <span class="svc">GLÜCK <b id="happy">58%</b></span>
        <div id="speed">
          <button class="speed" data-speed="0">Ⅱ</button>
          <button class="speed active" data-speed="1">1×</button>
          <button class="speed" data-speed="2">2×</button>
          <button class="speed" data-speed="3">3×</button>
        </div>
      </div>
    </div>

    <div id="tools">
      <button class="tool active" data-tool="0">
        <span class="hotkey">1</span>
        <svg viewBox="0 0 32 32"><path d="M7 29 13 3M19 29 25 3M12 17h9M10 24h9M14 10h9"/></svg>
        <div class="label">STRASSE</div><div class="cost">Ziehen = sauberer Bogen · CHF 120</div>
      </button>
      <button class="tool zone-r" data-tool="1">
        <span class="hotkey">2</span>
        <svg viewBox="0 0 32 32"><path d="m5 15 11-9 11 9"/><path d="M8 14v13h16V14M13 27v-8h6v8"/></svg>
        <div class="label">WOHNEN</div><div class="cost">Wohnzone</div>
      </button>
      <button class="tool zone-c" data-tool="2">
        <span class="hotkey">3</span>
        <svg viewBox="0 0 32 32"><path d="M6 12h20l-2-6H8zM8 12v15h16V12M12 27v-8h8v8M10 16h4M18 16h4"/></svg>
        <div class="label">GEWERBE</div><div class="cost">Geschäfte</div>
      </button>
      <button class="tool zone-i" data-tool="3">
        <span class="hotkey">4</span>
        <svg viewBox="0 0 32 32"><path d="M5 27V14l7 4v-6l7 5v-7l8 5v12zM22 10V4h4v9"/></svg>
        <div class="label">INDUSTRIE</div><div class="cost">Produktion</div>
      </button>
      <button class="tool demo" data-tool="4">
        <span class="hotkey">5</span>
        <svg viewBox="0 0 32 32"><path d="m8 24 13-13M17 7l8 8M6 26l5-1-4-4zM21 8l3-3 4 4-3 3"/></svg>
        <div class="label">ABRISS</div><div class="cost">Entfernen</div>
      </button>
      <button class="tool" data-tool="5">
        <span class="hotkey">6</span>
        <svg viewBox="0 0 32 32"><path d="m18 3-9 15h7l-2 11 9-16h-7z"/></svg>
        <div class="label">STROM</div><div class="cost">CHF 6'500</div>
      </button>
      <button class="tool" data-tool="6">
        <span class="hotkey">7</span>
        <svg viewBox="0 0 32 32"><path d="M16 3C12 10 8 14 8 20a8 8 0 0 0 16 0c0-6-4-10-8-17z"/></svg>
        <div class="label">WASSER</div><div class="cost">CHF 3'600</div>
      </button>
      <button class="tool" data-tool="7">
        <span class="hotkey">8</span>
        <svg viewBox="0 0 32 32"><path d="M16 4 9 15h4l-5 8h7v5h2v-5h7l-5-8h4z"/></svg>
        <div class="label">PARK</div><div class="cost">CHF 1'200</div>
      </button>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById("canvas");
const statusEl=document.getElementById("status");
let runtimeReady=false;

function chf(n){
  const sign=n<0?"-":"";
  return sign+"CHF "+Math.abs(n).toLocaleString("de-CH");
}
function bridge(name,returnType="number",argTypes=[],args=[]){
  if(!runtimeReady || typeof Module.ccall!=="function") return 0;
  try{
    return Module.ccall(name,returnType,argTypes,args);
  }catch(err){
    console.error("City Lab bridge error:",name,err);
    return 0;
  }
}
function getv(name){return bridge(name,"number",[],[])}

function refreshHUD(){
  if(!runtimeReady)return;

  const pop=getv("CityPopulation");
  const target=getv("CityMilestoneTarget");
  const net=getv("CityNetMonthly");
  const tool=getv("CitySelectedTool");
  const speed=getv("CitySpeed");

  document.getElementById("money").textContent=chf(getv("CityMoney"));
  document.getElementById("population").textContent=pop.toLocaleString("de-CH");
  document.getElementById("jobs").textContent=getv("CityFilledJobs")+" / "+getv("CityTotalJobs");

  const netEl=document.getElementById("net");
  netEl.textContent=(net>=0?"+":"")+net.toLocaleString("de-CH");
  netEl.style.color=net>=0?"var(--green)":"var(--red)";

  document.getElementById("power").textContent=getv("CityPowerUsed")+" / "+getv("CityPowerCapacity");
  document.getElementById("water").textContent=getv("CityWaterUsed")+" / "+getv("CityWaterCapacity");
  document.getElementById("happy").textContent=getv("CityHappiness")+"%";
  document.getElementById("rd").style.width=getv("CityResidentialDemand")+"%";
  document.getElementById("cd").style.width=getv("CityCommercialDemand")+"%";
  document.getElementById("id").style.width=getv("CityIndustrialDemand")+"%";
  document.getElementById("level").textContent="STUFE "+getv("CityLevel");
  document.getElementById("score").textContent=getv("CityScore");
  document.getElementById("traffic").textContent=getv("CityVehicleCount");
  document.getElementById("date").textContent=getv("CityDay")+"."+getv("CityMonth")+"."+getv("CityYear");
  document.getElementById("objectiveText").textContent=
    target>900000?"MAX":pop.toLocaleString("de-CH")+" / "+target.toLocaleString("de-CH");
  document.getElementById("objectiveFill").style.width=
    target>900000?"100%":Math.min(100,pop/Math.max(1,target)*100)+"%";

  document.querySelectorAll(".tool").forEach(el=>
    el.classList.toggle("active",Number(el.dataset.tool)===tool));
  document.querySelectorAll(".speed").forEach(el=>
    el.classList.toggle("active",Number(el.dataset.speed)===speed));
}

document.querySelectorAll(".tool").forEach(btn=>{
  btn.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();
    const value=Number(btn.dataset.tool);
    bridge("CitySetTool",null,["number"],[value]);
    document.querySelectorAll(".tool").forEach(el=>
      el.classList.toggle("active",Number(el.dataset.tool)===value));
    setTimeout(refreshHUD,25);
    canvas.focus();
  });
});

document.querySelectorAll(".speed").forEach(btn=>{
  btn.addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();
    const value=Number(btn.dataset.speed);
    bridge("CitySetSpeed",null,["number"],[value]);
    document.querySelectorAll(".speed").forEach(el=>
      el.classList.toggle("active",Number(el.dataset.speed)===value));
    setTimeout(refreshHUD,25);
    canvas.focus();
  });
});

var Module={
  canvas,
  setStatus:t=>{
    if(!statusEl)return;
    if(t)statusEl.textContent=t;
    else statusEl.remove();
  },
  onRuntimeInitialized:()=>{
    runtimeReady=true;
    refreshHUD();
    setInterval(refreshHUD,150);
    canvas.focus();
  }
};
window.addEventListener("load",()=>canvas.focus());
</script>
{{{ SCRIPT }}}
</body>
</html>
