<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Lab v0.8</title>
<style>
:root{
  --glass:rgba(18,28,34,.82);
  --glass2:rgba(26,39,46,.88);
  --line:rgba(255,255,255,.09);
  --text:#f2f6f7;
  --muted:#a9bac0;
  --accent:#74c6d9;
  --green:#67ce84;
  --blue:#61a9f0;
  --yellow:#e6bd54;
  --red:#eb7a68;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bbbd0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;outline:none;image-rendering:auto}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;padding:13px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(15,23,28,.94);box-shadow:0 16px 50px rgba(0,0,0,.28);font-size:14px}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);box-shadow:0 12px 38px rgba(0,0,0,.18)}
#topbar{position:absolute;left:18px;right:18px;top:14px;height:52px;border-radius:18px;display:flex;align-items:center;padding:0 16px;gap:18px}
.brand{font-weight:750;font-size:19px;letter-spacing:.02em}.version{font-size:11px;color:var(--accent);margin-left:-13px}
.metric{display:flex;align-items:baseline;gap:7px;white-space:nowrap}.metric b{font-size:14px;font-weight:650}.metric span{font-size:11px;color:var(--muted)}
.spacer{flex:1}.date{font-size:12px;color:#d6e0e3}
#progress{position:absolute;left:20px;top:80px;width:250px;border-radius:18px;padding:13px 14px}
.progress-title{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}.progress-title span:last-child{color:var(--muted)}
.track{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#58b7cf,#7dd9c0);transition:width .25s}
#dock-wrap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(1180px,calc(100vw - 28px));}
#citybar{height:48px;border-radius:18px;margin-bottom:8px;display:grid;grid-template-columns:minmax(390px,1.25fr) minmax(260px,.85fr) minmax(300px,1fr);align-items:center;padding:0 14px;gap:10px}
#economy{display:flex;gap:18px;align-items:center;min-width:0}
.smallstat{white-space:nowrap}.smallstat strong{font-size:13px}.smallstat span{font-size:10px;color:var(--muted);margin-left:5px}
#demand{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:7px;align-items:center;font-size:10px;color:var(--muted)}
.dbar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.dbar i{display:block;height:100%;border-radius:inherit;transition:width .2s}
#services{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:10px;color:var(--muted)}
.service strong{font-size:11px;color:var(--text);font-weight:600}
#speed{display:flex;gap:5px;pointer-events:auto}.speedbtn{border:1px solid transparent;background:rgba(255,255,255,.055);color:var(--muted);height:30px;min-width:34px;border-radius:11px;cursor:pointer;font:600 11px inherit}.speedbtn:hover{background:rgba(255,255,255,.1)}.speedbtn.active{color:white;border-color:rgba(116,198,217,.65);background:rgba(116,198,217,.16)}
#tools{height:70px;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;pointer-events:auto}
.tool{position:relative;border:1px solid transparent;border-radius:16px;background:rgba(255,255,255,.045);color:var(--text);padding:8px 10px;text-align:left;cursor:pointer;min-width:0;transition:.16s ease}
.tool:hover{transform:translateY(-1px);background:rgba(255,255,255,.085)}.tool.active{background:rgba(116,198,217,.13);border-color:rgba(116,198,217,.55);box-shadow:inset 0 0 0 1px rgba(116,198,217,.08)}
.tool .key{position:absolute;right:9px;top:8px;width:18px;height:18px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.08);font-size:9px;color:var(--muted)}
.tool .name{font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool .sub{font-size:9px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool[data-tool="1"]{--c:var(--green)}.tool[data-tool="2"]{--c:var(--blue)}.tool[data-tool="3"]{--c:var(--yellow)}.tool[data-tool="4"]{--c:var(--red)}
.tool.active:before{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2px;border-radius:2px;background:var(--c,var(--accent))}
@media(max-width:1050px){#topbar .optional{display:none}#citybar{grid-template-columns:1fr 1fr}#services{display:none}.tool .sub{display:none}}
@media(max-width:760px){#progress{display:none}#citybar{display:none}#tools{grid-template-columns:repeat(4,1fr);height:124px}.tool{min-height:50px}.brand{font-size:16px}}
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">City Lab v0.8 wird geladen…</div>

<div id="hud">
  <div id="topbar" class="glass">
    <div class="brand">City Lab</div><div class="version">v0.8</div>
    <div class="metric"><b id="top-level">Stufe 1</b><span>Stadt</span></div>
    <div class="metric"><b id="top-score">50</b><span>Score</span></div>
    <div class="metric optional"><b id="top-traffic">0</b><span>Verkehr</span></div>
    <div class="spacer"></div>
    <div class="date" id="date">1.1.2026</div>
  </div>

  <div id="progress" class="glass">
    <div class="progress-title"><b id="prog-title">Stadtstufe 1</b><span id="prog-text">0 / 100</span></div>
    <div class="track"><div class="fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div id="dock-wrap">
    <div id="citybar" class="glass">
      <div id="economy">
        <div class="smallstat"><strong id="money">CHF 60'000</strong><span>Budget</span></div>
        <div class="smallstat"><strong id="population">0</strong><span>Einwohner</span></div>
        <div class="smallstat"><strong id="jobs">0 / 0</strong><span>Jobs</span></div>
        <div class="smallstat"><strong id="net">-110</strong><span>/ Monat</span></div>
      </div>
      <div id="demand">
        <b>W</b><div class="dbar"><i id="rd" style="width:72%;background:var(--green)"></i></div>
        <b>G</b><div class="dbar"><i id="cd" style="width:36%;background:var(--blue)"></i></div>
        <b>I</b><div class="dbar"><i id="id" style="width:46%;background:var(--yellow)"></i></div>
      </div>
      <div id="services">
        <div class="service">Strom <strong id="power">0 / 0</strong></div>
        <div class="service">Wasser <strong id="water">0 / 0</strong></div>
        <div class="service">Glück <strong id="happy">58%</strong></div>
        <div id="speed">
          <button class="speedbtn" data-speed="0">Ⅱ</button>
          <button class="speedbtn active" data-speed="1">1×</button>
          <button class="speedbtn" data-speed="2">2×</button>
          <button class="speedbtn" data-speed="3">3×</button>
        </div>
      </div>
    </div>

    <div id="tools" class="glass">
      <button class="tool active" data-tool="0"><span class="key">1</span><div class="name">Straße</div><div class="sub">CHF 120 · 8 Richtungen</div></button>
      <button class="tool" data-tool="1"><span class="key">2</span><div class="name">Wohnen</div><div class="sub">Wohnzone</div></button>
      <button class="tool" data-tool="2"><span class="key">3</span><div class="name">Gewerbe</div><div class="sub">Geschäfte & Büros</div></button>
      <button class="tool" data-tool="3"><span class="key">4</span><div class="name">Industrie</div><div class="sub">Produktion & Jobs</div></button>
      <button class="tool" data-tool="4"><span class="key">5</span><div class="name">Abriss</div><div class="sub">Entfernen</div></button>
      <button class="tool" data-tool="5"><span class="key">6</span><div class="name">Strom</div><div class="sub">CHF 6'500</div></button>
      <button class="tool" data-tool="6"><span class="key">7</span><div class="name">Wasser</div><div class="sub">CHF 3'600</div></button>
      <button class="tool" data-tool="7"><span class="key">8</span><div class="name">Park</div><div class="sub">CHF 1'200</div></button>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas');
const statusEl=document.getElementById('status');

function chf(n){
  const sign=n<0?'-':'';
  return sign+"CHF "+Math.abs(n).toLocaleString("de-CH");
}
function call(name,...args){
  const fn=Module["_"+name];
  return typeof fn==="function"?fn(...args):0;
}
function refreshHUD(){
  if(!Module.calledRun)return;
  const money=call("CityMoney"), pop=call("CityPopulation");
  const jobs=call("CityFilledJobs"), totalJobs=call("CityTotalJobs");
  const net=call("CityNetMonthly"), level=call("CityLevel"), score=call("CityScore");
  const target=call("CityMilestoneTarget"), speed=call("CitySpeed"), tool=call("CitySelectedTool");

  document.getElementById("money").textContent=chf(money);
  document.getElementById("population").textContent=pop.toLocaleString("de-CH");
  document.getElementById("jobs").textContent=jobs+" / "+totalJobs;
  const netEl=document.getElementById("net"); netEl.textContent=(net>=0?"+":"")+net.toLocaleString("de-CH"); netEl.style.color=net>=0?"var(--green)":"var(--red)";
  document.getElementById("power").textContent=call("CityPowerUsed")+" / "+call("CityPowerCapacity");
  document.getElementById("water").textContent=call("CityWaterUsed")+" / "+call("CityWaterCapacity");
  document.getElementById("happy").textContent=call("CityHappiness")+"%";
  document.getElementById("rd").style.width=call("CityResidentialDemand")+"%";
  document.getElementById("cd").style.width=call("CityCommercialDemand")+"%";
  document.getElementById("id").style.width=call("CityIndustrialDemand")+"%";
  document.getElementById("top-level").textContent="Stufe "+level;
  document.getElementById("top-score").textContent=score;
  document.getElementById("top-traffic").textContent=call("CityVehicleCount");
  document.getElementById("date").textContent=call("CityDay")+"."+call("CityMonth")+"."+call("CityYear");
  document.getElementById("prog-title").textContent="Stadtstufe "+level;
  document.getElementById("prog-text").textContent=target>900000?"Metropole":pop.toLocaleString("de-CH")+" / "+target.toLocaleString("de-CH");
  document.getElementById("prog-fill").style.width=target>900000?"100%":Math.min(100,pop/Math.max(1,target)*100)+"%";

  document.querySelectorAll(".tool").forEach(el=>el.classList.toggle("active",+el.dataset.tool===tool));
  document.querySelectorAll(".speedbtn").forEach(el=>el.classList.toggle("active",+el.dataset.speed===speed));
}
document.querySelectorAll(".tool").forEach(btn=>btn.addEventListener("click",e=>{
  e.stopPropagation(); call("CitySetTool",+btn.dataset.tool); refreshHUD(); canvas.focus();
}));
document.querySelectorAll(".speedbtn").forEach(btn=>btn.addEventListener("click",e=>{
  e.stopPropagation(); call("CitySetSpeed",+btn.dataset.speed); refreshHUD(); canvas.focus();
}));

var Module={
  canvas,
  setStatus:(text)=>{
    if(!statusEl)return;
    if(text){statusEl.textContent=text;}else{statusEl.remove();}
  },
  onRuntimeInitialized:()=>{
    setInterval(refreshHUD,180);
    refreshHUD();
    canvas.focus();
  }
};
window.addEventListener("load",()=>canvas.focus());
</script>
{{{ SCRIPT }}}
</body>
</html>
